[project]
name = "hey-my-buddy"
version = "0.4.0"
description = "A durable agent blackboard with independent workers and C-Two RPC"
requires-python = ">=3.12,<3.15"
dependencies = ["c-two==0.5.1", "pyyaml>=6,<7"]

[project.scripts]
buddy = "buddy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/buddy"]
