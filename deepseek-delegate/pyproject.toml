[project]
name = "hey-my-buddy"
version = "0.3.0"
description = "Local dsh delegation with C-Two IPC and Codex completion delivery"
requires-python = ">=3.12,<3.15"
dependencies = ["c-two==0.5.1", "mcp>=1.26,<2", "pyyaml>=6,<7"]

[project.scripts]
buddy = "buddy.cli:main"
buddy-mcp = "buddy.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/buddy"]
