[project]
name = "hey-my-buddy"
version = "0.28.0"
description = "A durable agent blackboard with independent workers and C-Two RPC"
requires-python = ">=3.12,<3.15"
dependencies = ["c-two==0.6.0", "portalocker>=3,<4", "pyyaml>=6,<7"]

[project.scripts]
hey-my-buddy = "buddy.package_install:main"

[build-system]
requires = ["hatchling", "portalocker>=3,<4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buddy"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/pyproject.toml", "/uv.lock", "/packaging/hatch_build.py", "/packaging/runtime-assets.json", "/src/buddy", "/harnesses/dsh/scripts", "/harnesses/dsh/plugins", "/skills/buddy/SKILL.md", "/skills/buddy/scripts", "/docs/reference"]
exclude = ["**/__pycache__", "**/*.pyc", "**/node_modules", "**/.venv", "**/_distribution"]

[tool.hatch.build.hooks.custom]
path = "packaging/hatch_build.py"
