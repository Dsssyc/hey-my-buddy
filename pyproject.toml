[project]
name = "hey-my-buddy"
version = "0.53.1"
description = "A durable agent blackboard with independent workers and C-Two RPC"
requires-python = ">=3.12,<3.13"
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "c-two==0.9.0",
    "portalocker>=3,<4",
    "psutil>=7,<8",
    "pywin32; sys_platform == 'win32'",
    "pydantic>=2,<3",
    "zstandard>=0.25,<1",
]

[project.urls]
Repository = "https://github.com/Dsssyc/hey-my-buddy"
Documentation = "https://github.com/Dsssyc/hey-my-buddy/blob/main/docs/README.md"

[project.scripts]
hey-my-buddy = "hey_my_buddy.install.package_install:main"

[dependency-groups]
dev = ["distlib>=0.4,<0.5"]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme==25.1.0", "portalocker>=3,<4"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\]\()(?![a-zA-Z][a-zA-Z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)'
replacement = '\1https://raw.githubusercontent.com/Dsssyc/hey-my-buddy/main/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\[[^\]]*\]\()(?![a-zA-Z][a-zA-Z0-9+.-]*:|[/#])(?:\./)?([^\s)]+/)(\))'
replacement = '\1https://github.com/Dsssyc/hey-my-buddy/tree/main/\2\3'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\[[^\]]*\]\()(?![a-zA-Z][a-zA-Z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)'
replacement = '\1https://github.com/Dsssyc/hey-my-buddy/blob/main/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''(?i)(\b(?:src|srcset)\s*=\s*["'])(?![a-zA-Z][a-zA-Z0-9+.-]*:|[/#])(?:\./)?([^\s"']+)'''
replacement = '\1https://raw.githubusercontent.com/Dsssyc/hey-my-buddy/main/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''(?i)(\bhref\s*=\s*["'])(?![a-zA-Z][a-zA-Z0-9+.-]*:|[/#])(?:\./)?([^\s"']+)'''
replacement = '\1https://github.com/Dsssyc/hey-my-buddy/blob/main/\2'

[tool.hatch.build.targets.wheel]
packages = ["src/hey_my_buddy"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/uv.lock", "/packaging/hatch_build.py", "/packaging/runtime-assets.json", "/src/hey_my_buddy", "/skills/hey-my-buddy/SKILL.md", "/skills/hey-my-buddy/scripts", "/docs/reference"]
exclude = ["**/__pycache__", "**/*.pyc", "**/node_modules", "**/.venv", "**/_distribution"]

[tool.hatch.build.hooks.custom]
path = "packaging/hatch_build.py"
